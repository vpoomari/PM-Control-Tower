# ==============================================================
# PM CONTROL TOWER — Production nginx reverse proxy
# Route map:
#   /socket.io/  → realtime gateway (127.0.0.1:3003, WebSocket + polling)
#   /            → Next.js standalone server (127.0.0.1:3000)
# Enable TLS with certbot:  certbot --nginx -d pm.example.com
# ==============================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pmct_app      { server 127.0.0.1:3000; keepalive 32; }
upstream pmct_realtime { server 127.0.0.1:3003; }

server {
    listen 80;
    server_name _;

    # CSV import/export payloads — raise if you import large datasets
    client_max_body_size 25m;

    # --- Realtime (Socket.IO, JWT-authenticated) ---
    location /socket.io/ {
        proxy_pass http://pmct_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Application + API ---
    location / {
        proxy_pass http://pmct_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # --- Static assets (Next.js build output) ---
    location /_next/static/ {
        proxy_pass http://pmct_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
